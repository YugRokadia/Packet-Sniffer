<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" role="img" aria-labelledby="t d">
  <title id="t">Packet Sniffer</title>
  <desc id="d">Animated hero: packets stream through TCP, UDP, DNS and TLS lanes, pass a C++ engine gate where they are classified and coloured, next to the project title.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#14264a"/></linearGradient><linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".045"/></pattern>
    <radialGradient id="g1"><stop offset="0" stop-color="#22d3ee" stop-opacity=".22"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2"><stop offset="0" stop-color="#a78bfa" stop-opacity=".22"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
    <clipPath id="tc"><rect x="50" y="104" width="560" height="84"><animate attributeName="width" from="0" to="560" dur="1.3s" begin=".3s" fill="freeze"/></rect></clipPath>
    <clipPath id="tk"><rect x="600" y="288" width="322" height="20"/></clipPath><clipPath id="card"><rect width="1000" height="360" rx="22"/></clipPath></defs>
  <style>
    .t{font-family:'Segoe UI',-apple-system,'Helvetica Neue',Arial,sans-serif}
    .m{font-family:SFMono-Regular,Consolas,Menlo,'DejaVu Sans Mono',monospace}
    @keyframes up{from{opacity:0;transform:translateY(14px)}}
    @keyframes pop{from{opacity:0;transform:scale(.8)}}
    @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    @keyframes flow{to{stroke-dashoffset:-24}}
    @keyframes sweep{from{transform:translateX(-320px)}to{transform:translateX(1320px)}}
    @keyframes ring{0%{transform:scale(.25);opacity:.9}100%{transform:scale(2.6);opacity:0}}
    @keyframes lit{0%,100%{opacity:0}4%,17%{opacity:1}26%{opacity:0}}
    @keyframes sel{0%,100%{opacity:0}2%,9%{opacity:1}14%{opacity:0}}
    @keyframes press{0%,100%{transform:scale(1)}3%{transform:scale(.86)}7%{transform:scale(1.06)}10%{transform:scale(1)}}
    @keyframes al{0%,4%{opacity:0;transform:translateX(18px)}9%,58%{opacity:1;transform:none}68%,100%{opacity:0;transform:translateX(-10px)}}
    .up{animation:up .8s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:var(--d,0s)}
    .pp{transform-box:fill-box;transform-origin:center;animation:pop .55s cubic-bezier(.2,.9,.3,1.4) backwards;animation-delay:var(--d,0s)}
    .pu{animation:pulse 2s ease-in-out infinite}
    .fl{stroke-dasharray:6 6;animation:flow 1s linear infinite}
    .cur{animation:blink 1.1s steps(1) infinite}
    .sw{animation:sweep 7s linear infinite;animation-delay:1.2s}
    .rg{transform-box:fill-box;transform-origin:center;animation:ring 2.6s ease-out infinite}
    .lit{animation:lit 6s ease-in-out infinite}
    .sel{animation:sel 9s ease-in-out infinite}
    .key{transform-box:fill-box;transform-origin:center;animation:press 9s ease-in-out infinite}
    .al{animation:al 10s ease-in-out infinite}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <rect width="1000" height="360" rx="22" fill="url(#bg)"/>
  <g clip-path="url(#card)">
    <circle cx="140" cy="60" r="260" fill="url(#g1)"><animate attributeName="cx" values="140;300;140" dur="14s" repeatCount="indefinite" /><animate attributeName="cy" values="60;120;60" dur="14s" repeatCount="indefinite" /></circle>
    <circle cx="880" cy="320" r="260" fill="url(#g2)"><animate attributeName="cx" values="880;700;880" dur="16s" repeatCount="indefinite" /><animate attributeName="cy" values="320;260;320" dur="16s" repeatCount="indefinite" /></circle>
  </g>
  <rect width="1000" height="360" rx="22" fill="url(#grid)"/>
  <g class="up" style="--d:0s"><text class="t" x="60" y="92" font-size="13" font-weight="600" letter-spacing="3" fill="#22d3ee">NETWORK TRAFFIC ANALYSIS</text></g>
  <text class="t" clip-path="url(#tc)" x="58" y="170" font-size="58" font-weight="800" fill="#e6edf6">Packet Sniffer<tspan class="cur" fill="#22d3ee">_</tspan></text>
  <g class="up" style="--d:1.5s"><text class="t" x="60" y="214" font-size="18" fill="#9fb3c8">Live traffic classification across 17 protocols,</text><text class="t" x="60" y="240" font-size="18" fill="#9fb3c8">a C++ capture engine and a Rich terminal dashboard.</text></g>
  <g class="t" font-size="14" font-weight="600" text-anchor="middle">
    <g class="pp" style="--d:1.9s"><rect x="60"  y="270" width="74"  height="30" rx="15" fill="#22d3ee" fill-opacity=".14" stroke="#22d3ee" stroke-opacity=".5"/><text x="97"  y="290" fill="#67e8f9">C++17</text></g>
    <g class="pp" style="--d:2.05s"><rect x="144" y="270" width="88"  height="30" rx="15" fill="#a78bfa" fill-opacity=".14" stroke="#a78bfa" stroke-opacity=".5"/><text x="188" y="290" fill="#c4b5fd">libpcap</text></g>
    <g class="pp" style="--d:2.2s"><rect x="242" y="270" width="122" height="30" rx="15" fill="#34d399" fill-opacity=".14" stroke="#34d399" stroke-opacity=".5"/><text x="303" y="290" fill="#6ee7b7">Python · Rich</text></g>
    <g class="pp" style="--d:2.35s"><rect x="374" y="270" width="130" height="30" rx="15" fill="#fbbf24" fill-opacity=".14" stroke="#fbbf24" stroke-opacity=".5"/><text x="439" y="290" fill="#fcd34d">Linux · Pi</text></g>
  </g>

