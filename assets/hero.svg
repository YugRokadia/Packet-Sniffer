<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img" aria-labelledby="t d">
  <title id="t">Packet Sniffer</title>
  <desc id="d">Packets flowing through lanes labelled TCP, UDP, DNS and TLS next to the project title and tech stack.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#14264a"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".045"/>
    </pattern>
  </defs>
  <style>
    .t{font-family:'Segoe UI',-apple-system,'Helvetica Neue',Arial,sans-serif}
    .m{font-family:SFMono-Regular,Consolas,Menlo,'DejaVu Sans Mono',monospace}
    @keyframes pk{0%{transform:translateX(0);opacity:0}12%{opacity:1}88%{opacity:1}100%{transform:translateX(250px);opacity:0}}
    .pk{animation:pk 4.2s linear infinite}
    .d1{animation-delay:-.6s}.d2{animation-delay:-1.9s}.d3{animation-delay:-3.1s}
    @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
    .cur{animation:blink 1.1s steps(1) infinite}
    @media (prefers-reduced-motion:reduce){.pk,.cur{animation:none;opacity:1}}
  </style>
  <rect width="1000" height="340" rx="22" fill="url(#bg)"/>
  <rect width="1000" height="340" rx="22" fill="url(#grid)"/>

  <text class="t" x="60" y="84" font-size="13" font-weight="600" letter-spacing="3" fill="#22d3ee">NETWORK TRAFFIC ANALYSIS</text>
  <text class="t" x="60" y="152" font-size="58" font-weight="800" fill="#e6edf6">Packet Sniffer<tspan class="cur" fill="#22d3ee">_</tspan></text>
  <text class="t" x="60" y="196" font-size="18" fill="#9fb3c8">Live traffic classification across 17 protocols,</text>
  <text class="t" x="60" y="222" font-size="18" fill="#9fb3c8">a C++ capture engine and a Rich terminal dashboard.</text>

  <g class="t" font-size="14" font-weight="600" text-anchor="middle">
    <rect x="60"  y="252" width="74"  height="30" rx="15" fill="#22d3ee" fill-opacity=".14" stroke="#22d3ee" stroke-opacity=".5"/><text x="97"  y="272" fill="#67e8f9">C++17</text>
    <rect x="144" y="252" width="88"  height="30" rx="15" fill="#a78bfa" fill-opacity=".14" stroke="#a78bfa" stroke-opacity=".5"/><text x="188" y="272" fill="#c4b5fd">libpcap</text>
    <rect x="242" y="252" width="122" height="30" rx="15" fill="#34d399" fill-opacity=".14" stroke="#34d399" stroke-opacity=".5"/><text x="303" y="272" fill="#6ee7b7">Python · Rich</text>
    <rect x="374" y="252" width="130" height="30" rx="15" fill="#fbbf24" fill-opacity=".14" stroke="#fbbf24" stroke-opacity=".5"/><text x="439" y="272" fill="#fcd34d">Linux · Pi</text>
  </g>

  <rect x="590" y="60" width="350" height="220" rx="16" fill="#0a1020" fill-opacity=".55" stroke="#ffffff" stroke-opacity=".08"/>
  <g class="m" font-size="12" font-weight="700">
    <text x="610" y="109" fill="#67e8f9">TCP</text>
    <text x="610" y="154" fill="#c4b5fd">UDP</text>
    <text x="610" y="199" fill="#fcd34d">DNS</text>
    <text x="610" y="244" fill="#6ee7b7">TLS</text>
  </g>
  <g stroke-width="1.5" stroke-dasharray="3 6">
    <line x1="650" y1="105" x2="925" y2="105" stroke="#67e8f9" stroke-opacity=".35"/>
    <line x1="650" y1="150" x2="925" y2="150" stroke="#c4b5fd" stroke-opacity=".35"/>
    <line x1="650" y1="195" x2="925" y2="195" stroke="#fcd34d" stroke-opacity=".35"/>
    <line x1="650" y1="240" x2="925" y2="240" stroke="#6ee7b7" stroke-opacity=".35"/>
  </g>
  <rect class="pk"    x="655" y="98"  width="26" height="14" rx="3" fill="#22d3ee"/>
  <rect class="pk d2" x="655" y="98"  width="26" height="14" rx="3" fill="#22d3ee"/>
  <rect class="pk d1" x="655" y="143" width="26" height="14" rx="3" fill="#a78bfa"/>
  <rect class="pk d3" x="655" y="143" width="26" height="14" rx="3" fill="#a78bfa"/>
  <rect class="pk d3" x="655" y="188" width="26" height="14" rx="3" fill="#fbbf24"/>
  <rect class="pk d1" x="655" y="188" width="26" height="14" rx="3" fill="#fbbf24"/>
  <rect class="pk d2" x="655" y="233" width="26" height="14" rx="3" fill="#34d399"/>
  <rect class="pk"    x="655" y="233" width="26" height="14" rx="3" fill="#34d399"/>
</svg>
