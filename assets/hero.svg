    <circle class="rg" cx="760" cy="180" r="30" fill="none" stroke="#22d3ee" stroke-width="2"/>
    <circle class="rg" cx="760" cy="180" r="30" fill="none" stroke="#22d3ee" stroke-width="2" style="animation-delay:-1.3s"/>
    <rect x="753" y="80" width="14" height="200" rx="7" fill="#22d3ee" fill-opacity=".1" stroke="#22d3ee" stroke-opacity=".7"><animate attributeName="stroke-opacity" values=".3;.9;.3" dur="2s" repeatCount="indefinite" /></rect>
    <rect x="750" y="84" width="20" height="3" rx="1.5" fill="#a5f3fc"><animate attributeName="y" values="84;274;84" dur="2.6s" repeatCount="indefinite" /></rect>
    <rect x="652" y="101" width="26" height="14" rx="3" fill="#22d3ee"><animate attributeName="x" from="652" to="904" dur="3.4s" begin="0s" repeatCount="indefinite"/><animate attributeName="fill" values="#64748b;#64748b;#22d3ee;#22d3ee" keyTimes="0;.42;.44;1" dur="3.4s" begin="0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.9;1" dur="3.4s" begin="0s" repeatCount="indefinite"/></rect><rect x="652" y="101" width="26" height="14" rx="3" fill="#22d3ee"><animate attributeName="x" from="652" to="904" dur="3.4s" begin="-1.15s" repeatCount="indefinite"/><animate attributeName="fill" values="#64748b;#64748b;#22d3ee;#22d3ee" keyTimes="0;.42;.44;1" dur="3.4s" begin="-1.15s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.9;1" dur="3.4s" begin="-1.15s" repeatCount="indefinite"/></rect><rect x="652" y="101" width="26" height="14" rx="3" fill="#22d3ee"><animate attributeName="x" from="652" to="904" dur="3.4s" begin="-2.3s" repeatCount="indefinite"/><animate attributeName="fill" values="#64748b;#64748b;#22d3ee;#22d3ee" keyTimes="0;.42;.44;1" dur="3.4s" begin="-2.3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.9;1" dur="3.4s" begin="-2.3s" repeatCount="indefinite"/></rect><rect x="652" y="149" width="26" height="14" rx="3" fill="#a78bfa"><animate attributeName="x" from="652" to="904" dur="4.2s" begin="-0.4s" repeatCount="indefinite"/><animate attributeName="fill" values="#64748b;#64748b;#a78bfa;#a78bfa" keyTimes="0;.42;.44;1" dur="4.2s" begin="-0.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.9;1" dur="4.2s" begin="-0.4s" repeatCount="indefinite"/></rect><rect x="652" y="149" width="26" height="14" rx="3" fill="#a78bfa"><animate attributeName="x" from="652" to="904" dur="4.2s" begin="-1.8s" repeatCount="indefinite"/><animate attributeName="fill" values="#64748b;#64748b;#a78bfa;#a78bfa" keyTimes="