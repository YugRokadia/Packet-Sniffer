<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-labelledby="t d">
  <title id="t">Packet Sniffer pipeline</title>
  <desc id="d">Animated data path: network interface to libpcap to the C++ engine to a JSON stream to the Rich dashboard, with alerts raised for DNS tunneling and unencrypted protocols.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#14264a"/></linearGradient><linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#22d3ee"/></marker><clipPath id="card"><rect width="1000" height="300" rx="22"/></clipPath></defs>
  <style>
    .t{font-family:'Segoe UI',-apple-system,'Helvetica Neue',Arial,sans-serif}
    .m{font-family:SFMono-Regular,Consolas,Menlo,'DejaVu Sans Mono',monospace}
    @keyframes up{from{opacity:0;transform:translateY(14px)}}
    @keyframes pop{from{opacity:0;transform:scale(.8)}}
    @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    @keyframes flow{to{stroke-dashoffset:-24}}
    @keyframes sweep{from{transform:translateX(-320px)}to{transform:translateX(1320px)}}
    @keyframes ring{0%{transform:scale(.25);opacity:.9}100%{transform:scale(2.6);opacity:0}}
    @keyframes lit{0%,100%{opacity:0}4%,17%{opacity:1}26%{opacity:0}}
    @keyframes sel{0%,100%{opacity:0}2%,9%{opacity:1}14%{opacity:0}}
    @keyframes press{0%,100%{transform:scale(1)}3%{transform:scale(.86)}7%{transform:scale(1.06)}10%{transform:scale(1)}}
    @keyframes al{0%,4%{opacity:0;transform:translateX(18px)}9%,58%{opacity:1;transform:none}68%,100%{opacity:0;transform:translateX(-10px)}}
    .up{animation:up .8s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:var(--d,0s)}
    .pp{transform-box:fill-box;transform-origin:center;animation:pop .55s cubic-bezier(.2,.9,.3,1.4) backwards;animation-delay:var(--d,0s)}
    .pu{animation:pulse 2s ease-in-out infinite}
    .fl{stroke-dasharray:6 6;animation:flow 1s linear infinite}
    .cur{animation:blink 1.1s steps(1) infinite}
    .sw{animation:sweep 7s linear infinite;animation-delay:1.2s}
    .rg{transform-box:fill-box;transform-origin:center;animation:ring 2.6s ease-out infinite}
    .lit{animation:lit 6s ease-in-out infinite}
    .sel{animation:sel 9s ease-in-out infinite}
    .key{transform-box:fill-box;transform-origin:center;animation:press 9s ease-in-out infinite}
    .al{animation:al 10s ease-in-out infinite}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <rect width="1000" height="300" rx="22" fill="url(#bg)"/>
  <g class="up" style="--d:0s"><text class="t" x="40" y="44" font-size="13" font-weight="600" letter-spacing="3" fill="#22d3ee">HOW IT WORKS · LIVE DATA PATH</text></g>
  <g stroke="#22d3ee" stroke-width="2" fill="none" marker-end="url(#ah)" stroke-opacity=".9"><line class="fl" x1="182" y1="134" x2="220" y2="134"/><line class="fl" x1="376" y1="134" x2="414" y2="134"/><line class="fl" x1="584" y1="134" x2="622" y2="134"/><line class="fl" x1="778" y1="134" x2="816" y2="134"/></g>
  <circle r="9" fill="#22d3ee" fill-opacity=".18"><animateMotion dur="5.2s" begin="0s" repeatCount="indefinite" path="M32 134 H968"/></circle><circle r="4.5" fill="#a5f3fc"><animateMotion dur="5.2s" begin="0s" repeatCount="indefinite" path="M32 134 H968"/></circle><circle r="9" fill="#22d3ee" fill-opacity=".18"><animateMotion dur="5.2s" begin="-1.7s" repeatCount="indefinite" path="M32 134 H968"/></circle><circle r="4.5" fill="#a5f3fc"><animateMotion dur="5.2s" begin="-1.7s" repeatCount="indefinite" path="M32 134 H968"/></circle><circle r="9" fill="#22d3ee" fill-opacity=".18"><animateMotion dur="5.2s" begin="-3.4s" repeatCount="indefinite" path="M32 134 H968"/></circle><circle r="4.5" fill="#a5f3fc"><animateMotion dur="5.2s" begin="-3.4s" repeatCount="indefinite" path="M32 134 H968"/></circle>
  <g class="t"><g class="up" style="--d:0.10s"><rect x="30" y="86" width="150" height="96" rx="14" fill="#13213f" stroke="#22d3ee" stroke-opacity=".55" stroke-width="1"/></g><g class="up" style="--d:0.22s"><rect x="224" y="86" width="150" height="96" rx="14" fill="#13213f" stroke="#a78bfa" stroke-opacity=".55" stroke-width="1"/></g><g class="up" style="--d:0.34s"><rect x="418" y="86" width="164" height="96" rx="14" fill="#13213f" stroke="#22d3ee" stroke-opacity=".8" stroke-width="1.6"/></g><g class="up" style="--d:0.46s"><rect x="626" y="86" width="150" height="96" rx="14" fill="#13213f" stroke="#fbbf24" stroke-opacity=".55" stroke-width="1"/></g><g class="up" style="--d:0.58s"><rect x="820" y="86" width="150" height="96" rx="14" fill="#13213f" stroke="#34d399" stroke-opacity=".55" stroke-width="1"/></g><text x="105.0" y="130" font-size="16" font-weight="700" fill="#e6edf6" text-anchor="middle">Network</text><text x="105.0" y="152" font-size="16" font-weight="700" fill="#e6edf6" text-anchor="middle">interface</text><text x="299.0" y="130" font-size="16" font-weight="700" fill="#e6edf6" text-anchor="middle">libpcap</text><text x="299.0" y="152" font-size="13" fill="#9fb3c8" text-anchor="middle">raw capture</text><text x="500.0" y="126" font-size="16" font-weight="700" fill="#67e8f9" text-anchor="middle">C++ engine</text><text x="500.0" y="148" font-size="13" fill="#9fb3c8" text-anchor="middle">parse · classify</text><text x="500.0" y="166" font-size="13" fill="#9fb3c8" text-anchor="middle">TLS SNI extraction</text><text x="701.0" y="130" font-size="16" font-weight="700" fill="#e6edf6" text-anchor="middle">JSON stream</text><text x="701.0" y="152" font-size="13" fill="#9fb3c8" text-anchor="middle">stdout → stdin</text><text x="895.0" y="130" font-size="16" font-weight="700" fill="#e6edf6" text-anchor="middle">Rich TUI</text><text x="895.0" y="152" font-size="13" fill="#9fb3c8" text-anchor="middle">Python dashboard</text><text x="895.0" y="170" font-size="13" fill="#9fb3c8" text-anchor="middle">stats · logs · alerts</text></g>
  <circle cx="48" cy="104" r="3.5" fill="#34d399"><animate attributeName="opacity" values="1;.2;1" dur="1.2s" repeatCount="indefinite" /></circle><circle cx="60" cy="104" r="3.5" fill="#fbbf24"><animate attributeName="opacity" values="1;.2;1" dur="1.2s" repeatCount="indefinite" begin="-.4s"/></circle><circle cx="72" cy="104" r="3.5" fill="#22d3ee"><animate attributeName="opacity" values="1;.2;1" dur="1.2s" repeatCount="indefinite" begin="-.8s"/></circle><circle cx="560" cy="106" r="9" fill="none" stroke="#67e8f9" stroke-width="2" stroke-dasharray="4 4"><animateTransform attributeName="transform" type="rotate" from="0 560 106" to="360 560 106" dur="3s" repeatCount="indefinite"/></circle><text class="m" x="752" y="110" font-size="13" font-weight="700" fill="#fcd34d" text-anchor="middle"><animate attributeName="opacity" values="1;.3;1" dur="1.6s" repeatCount="indefinite" />{ }</text><rect x="934" y="109" height="5" width="5" rx="1.5" fill="#6ee7b7"><animate attributeName="height" values="5;18;9;15;5" dur="1.6s" repeatCount="indefinite"/><animate attributeName="y" values="109;96;105;99;109" dur="1.6s" repeatCount="indefinite"/></rect><rect x="941" y="100" height="14" width="5" rx="1.5" fill="#6ee7b7"><animate attributeName="height" values="14;6;16;8;14" dur="2.0s" repeatCount="indefinite"/><animate attributeName="y" values="100;108;98;106;100" dur="2.0s" repeatCount="indefinite"/></rect><rect x="948" y="106" height="8" width="5" rx="1.5" fill="#6ee7b7"><animate attributeName="height" values="8;16;5;12;8" dur="2.4000000000000004s" repeatCount="indefinite"/><animate attributeName="y" values="106;98;109;102;106" dur="2.4000000000000004s" repeatCount="indefinite"/></rect>
  <rect class="lit" style="animation-delay:0s" x="30" y="86" width="150" height="96" rx="14" fill="#22d3ee" fill-opacity=".08" stroke="#e6fbff" stroke-width="2.4" opacity="0"/><rect class="lit" style="animation-delay:1s" x="224" y="86" width="150" height="96" rx="14" fill="#a78bfa" fill-opacity=".08" stroke="#e6fbff" stroke-width="2.4" opacity="0"/><rect class="lit" style="animation-delay:2s" x="418" y="86" width="164" height="96" rx="14" fill="#22d3ee" fill-opacity=".08" stroke="#e6fbff" stroke-width="2.4" opacity="0"/><rect class="lit" style="animation-delay:3s" x="626" y="86" width="150" height="96" rx="14" fill="#fbbf24" fill-opacity=".08" stroke="#e6fbff" stroke-width="2.4" opacity="0"/><rect class="lit" style="animation-delay:4s" x="820" y="86" width="150" height="96" rx="14" fill="#34d399" fill-opacity=".08" stroke="#e6fbff" stroke-width="2.4" opacity="0"/>
  <g class="t" font-size="13" fill="#9fb3c8" text-anchor="middle">
    <text x="500" y="212">17 protocols · TCP · UDP · DNS · HTTPS</text>
    <text x="895" y="212">up to 4 split-screen panels</text></g>
  <path class="fl" d="M895 220 V240" stroke="#fbbf24" stroke-width="2" fill="none"/>
  <g class="t"><rect x="590" y="242" width="380" height="38" rx="19" fill="#fbbf24" fill-opacity=".12" stroke="#fbbf24" stroke-opacity=".6"><animate attributeName="stroke-opacity" values=".25;.9;.25" dur="1.8s" repeatCount="indefinite" /></rect>
    <text x="608" y="267" font-size="15" fill="#fcd34d"><animate attributeName="opacity" values="1;.3;1" dur="1.2s" repeatCount="indefinite" />⚠</text>
    <text x="800" y="266" font-size="13" font-weight="600" fill="#fcd34d" text-anchor="middle">Alerts: DNS tunneling · unencrypted protocols</text></g>
  <g clip-path="url(#card)"><polygon class="sw" points="0,0 140,0 90,300 -50,300" fill="url(#shine)"/></g>
</svg>