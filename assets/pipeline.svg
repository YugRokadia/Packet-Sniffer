<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 290" width="1000" height="290" role="img" aria-labelledby="t d">
  <title id="t">Packet Sniffer pipeline</title>
  <desc id="d">Network interface to libpcap to C++ capture engine to JSON stream to Python Rich dashboard, with security alerts raised in the dashboard.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#14264a"/></linearGradient>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#22d3ee"/></marker>
  </defs>
  <style>
    .t{font-family:'Segoe UI',-apple-system,'Helvetica Neue',Arial,sans-serif}
    @keyframes flow{to{stroke-dashoffset:-24}}
    .fl{stroke-dasharray:6 6;animation:flow 1s linear infinite}
    @media (prefers-reduced-motion:reduce){.fl{animation:none}}
  </style>
  <rect width="1000" height="290" rx="22" fill="url(#bg)"/>
  <text class="t" x="40" y="44" font-size="13" font-weight="600" letter-spacing="3" fill="#22d3ee">HOW IT WORKS</text>

  <g class="t" text-anchor="middle">
    <rect x="30"  y="80" width="150" height="86" rx="14" fill="#13213f" stroke="#22d3ee" stroke-opacity=".5"/>
    <rect x="224" y="80" width="150" height="86" rx="14" fill="#13213f" stroke="#a78bfa" stroke-opacity=".6"/>
    <rect x="418" y="80" width="164" height="86" rx="14" fill="#13213f" stroke="#22d3ee" stroke-opacity=".8" stroke-width="1.6"/>
    <rect x="626" y="80" width="150" height="86" rx="14" fill="#13213f" stroke="#fbbf24" stroke-opacity=".6"/>
    <rect x="820" y="80" width="150" height="86" rx="14" fill="#13213f" stroke="#34d399" stroke-opacity=".7"/>

    <text x="105" y="118" font-size="16" font-weight="700" fill="#e6edf6">Network</text>
    <text x="105" y="140" font-size="16" font-weight="700" fill="#e6edf6">interface</text>
    <text x="299" y="118" font-size="16" font-weight="700" fill="#e6edf6">libpcap</text>
    <text x="299" y="140" font-size="13" fill="#9fb3c8">raw capture</text>
    <text x="500" y="112" font-size="16" font-weight="700" fill="#67e8f9">C++ engine</text>
    <text x="500" y="134" font-size="13" fill="#9fb3c8">parse · classify</text>
    <text x="500" y="152" font-size="13" fill="#9fb3c8">TLS SNI extraction</text>
    <text x="701" y="118" font-size="16" font-weight="700" fill="#e6edf6">JSON stream</text>
    <text x="701" y="140" font-size="13" fill="#9fb3c8">stdout → stdin</text>
    <text x="895" y="112" font-size="16" font-weight="700" fill="#e6edf6">Rich TUI</text>
    <text x="895" y="134" font-size="13" fill="#9fb3c8">Python dashboard</text>
    <text x="895" y="152" font-size="13" fill="#9fb3c8">stats · logs · alerts</text>
  </g>

  <g stroke="#22d3ee" stroke-width="2" fill="none" marker-end="url(#ah)">
    <line class="fl" x1="182" y1="123" x2="220" y2="123"/>
    <line class="fl" x1="376" y1="123" x2="414" y2="123"/>
    <line class="fl" x1="584" y1="123" x2="622" y2="123"/>
    <line class="fl" x1="778" y1="123" x2="816" y2="123"/>
  </g>

  <g class="t" font-size="13" fill="#9fb3c8" text-anchor="middle">
    <text x="500" y="200">17 protocols · TCP · UDP · DNS · HTTPS</text>
    <text x="895" y="200">up to 4 split-screen panels</text>
  </g>

  <g class="t">
    <path d="M895 210 V232" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 4"/>
    <rect x="590" y="234" width="380" height="36" rx="18" fill="#fbbf24" fill-opacity=".12" stroke="#fbbf24" stroke-opacity=".55"/>
    <text x="780" y="257" font-size="13" font-weight="600" fill="#fcd34d" text-anchor="middle">⚠ Alerts: DNS tunneling · unencrypted protocols</text>
  </g>
</svg>
