<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img" aria-labelledby="t d">
  <title id="t">Dashboard views and keyboard shortcuts</title>
  <desc id="d">Animated: each of nine keyboard shortcuts lights up in turn, showing protocols, top talkers, HTTPS domains, DNS queries, recent packets, security alerts, raw logs, overview and split screen.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#14264a"/></linearGradient><linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><clipPath id="card"><rect width="1000" height="420" rx="22"/></clipPath></defs>
  <style>
    .t{font-family:'Segoe UI',-apple-system,'Helvetica Neue',Arial,sans-serif}
    .m{font-family:SFMono-Regular,Consolas,Menlo,'DejaVu Sans Mono',monospace}
    @keyframes up{from{opacity:0;transform:translateY(14px)}}
    @keyframes pop{from{opacity:0;transform:scale(.8)}}
    @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    @keyframes flow{to{stroke-dashoffset:-24}}
    @keyframes sweep{from{transform:translateX(-320px)}to{transform:translateX(1320px)}}
    @keyframes ring{0%{transform:scale(.25);opacity:.9}100%{transform:scale(2.6);opacity:0}}
    @keyframes lit{0%,100%{opacity:0}4%,17%{opacity:1}26%{opacity:0}}
    @keyframes sel{0%,100%{opacity:0}2%,9%{opacity:1}14%{opacity:0}}
    @keyframes press{0%,100%{transform:scale(1)}3%{transform:scale(.86)}7%{transform:scale(1.06)}10%{transform:scale(1)}}
    @keyframes al{0%,4%{opacity:0;transform:translateX(18px)}9%,58%{opacity:1;transform:none}68%,100%{opacity:0;transform:translateX(-10px)}}
    .up{animation:up .8s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:var(--d,0s)}
    .pp{transform-box:fill-box;transform-origin:center;animation:pop .55s cubic-bezier(.2,.9,.3,1.4) backwards;animation-delay:var(--d,0s)}
    .pu{animation:pulse 2s ease-in-out infinite}
    .fl{stroke-dasharray:6 6;animation:flow 1s linear infinite}
    .cur{animation:blink 1.1s steps(1) infinite}
    .sw{animation:sweep 7s linear infinite;animation-delay:1.2s}
    .rg{transform-box:fill-box;transform-origin:center;animation:ring 2.6s ease-out infinite}
    .lit{animation:lit 6s ease-in-out infinite}
    .sel{animation:sel 9s ease-in-out infinite}
    .key{transform-box:fill-box;transform-origin:center;animation:press 9s ease-in-out infinite}
    .al{animation:al 10s ease-in-out infinite}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <rect width="1000" height="420" rx="22" fill="url(#bg)"/>
  <g class="up" style="--d:0s"><text class="t" x="40" y="44" font-size="13" font-weight="600" letter-spacing="3" fill="#22d3ee">ONE KEY PER VIEW</text></g>
  <g class="up" style="--d:0.10s"><g transform="translate(40,68)">
    <rect width="290" height="84" rx="14" fill="#13213f" stroke="#22d3ee" stroke-opacity=".35"/>
    <rect class="sel" style="animation-delay:0s" width="290" height="84" rx="14" fill="#22d3ee" fill-opacity=".1" stroke="#67e8f9" stroke-width="2.4" opacity="0"/>
    <rect class="key" style="animation-delay:0s" x="18" y="22" width="40" height="40" rx="9" fill="#22d3ee" fill-opacity=".16" stroke="#22d3ee"/>
    <text class="m" x="38" y="49" font-size="20" font-weight="700" fill="#67e8f9" text-anchor="middle">P</text>
    <text class="t" x="74" y="38" font-size="17" font-weight="700" fill="#e6edf6">Protocols</text>
    <text class="t" x="74" y="60" font-size="13" fill="#9fb3c8">live protocol breakdown</text>
  </g></g>
  <g class="up" style="--d:0.19s"><g transform="translate(355,68)">
    <rect width="290" height="84" rx="14" fill="#13213f" stroke="#a78bfa" stroke-opacity=".35"/>
    <rect class="sel" style="animation-delay:1s" width="290" height="84" rx="14" fill="#a78bfa" fill-opacity=".1" stroke="#c4b5fd" stroke-width="2.4" opacity="0"/>
    <rect class="key" style="animation-delay:1s" x="18" y="22" width="40" height="40" rx="9" fill="#a78bfa" fill-opacity=".16" stroke="#a78bfa"/>
    <text class="m" x="38" y="49" font-size="20" font-weight="700" fill="#c4b5fd" text-anchor="middle">T</text>
    <text class="t" x="74" y="38" font-size="17" font-weight="700" fill="#e6edf6">Top talkers</text>
    <text class="t" x="74" y="60" font-size="13" fill="#9fb3c8">ranked by traffic volume</text>
  </g></g>
  <g class="up" style="--d:0.28s"><g transform="translate(670,68)">
    <rect width="290" height="84" rx="14" fill="#13213f" stroke="#34d399" stroke-opacity=".35"/>
    <rect class="sel" style="animation-delay:2s" width="290" height="84" rx="14" fill="#34d399" fill-opacity=".1" stroke="#6ee7b7" stroke-width="2.4" opacity="0"/>
    <rect class="key" style="animation-delay:2s" x="18" y="22" width="40" height="40" rx="9" fill="#34d399" fill-opacity=".16" stroke="#34d399"/>
    <text class="m" x="38" y="49" font-size="20" font-weight="700" fill="#6ee7b7" text-anchor="middle">D</text>
    <text class="t" x="74" y="38" font-size="17" font-weight="700" fill="#e6edf6">HTTPS domains</text>
    <text class="t" x="74" y="60" font-size="13" fill="#9fb3c8">domains seen via TLS SNI</text>
  </g></g>
  <g class="up" style="--d:0.37s"><g transform="translate(40,168)">
    <rect width="290" height="84" rx="14" fill="#13213f" stroke="#fbbf24" stroke-opacity=".35"/>
    <rect class="sel" style="animation-delay:3s" width="290" height="84" rx="14" fill="#fbbf24" fill-opacity=".1" stroke="#fcd34d" stroke-width="2.4" opacity="0"/>
    <rect class="key" style="animation-delay:3s" x="18" y="22" width="40" height="40" rx="9" fill="#fbbf24" fill-opacity=".16" stroke="#fbbf24"/>
    <text class="m" x="38" y="49" font-size="20" font-weight="700" fill="#fcd34d" text-anchor="middle">N</text>
    <text class="t" x="74" y="38" font-size="17" font-weight="700" fill="#e6edf6">DNS queries</text>
    <text class="t" x="74" y="60" font-size="13" fill="#9fb3c8">what is resolving, live</text>
  </g></g>
  <g class="up" style="--d:0.46s"><g transform="translate(355,168)">
    <rect width="290" height="84" rx="14" fill="#13213f" stroke="#22d3ee" stroke-opacity=".35"/>
    <rect class="sel" style="animation-delay:4s" width="290" height="84" rx="14" fill="#22d3ee" fill-opacity=".1" stroke="#67e8f9" stroke-width="2.4" opacity="0"/>
    <rect class="key" style="animation-delay:4s" x="18" y="22" width="40" height="40" rx="9" fill="#22d3ee" fill-opacity=".16" stroke="#22d3ee"/>
    <text class="m" x="38" y="49" font-size="20" font-weight="700" fill="#67e8f9" text-anchor="middle">R</text>
    <text class="t" x="74" y="38" font-size="17" font-weight="700" fill="#e6edf6">Recent packets</text>
    <text class="t" x="74" y="60" font-size="13" fill="#9fb3c8">rolling packet stream</text>
  </g></g>
  <g class="up" style="--d:0.55s"><g transform="translate(670,168)">
    <rect width="290" height="84" rx="14" fill="#13213f" stroke="#f87171" stroke-opacity=".35"/>
    <rect class="sel" style="animation-delay:5s" width="290" height="84" rx="14" fill="#f87171" fill-opacity=".1" stroke="#fca5a5" stroke-width="2.4" opacity="0"/>
    <rect class="key" style="animation-delay:5s" x="18" y="22" width="40" height="40" rx="9" fill="#f87171" fill-opacity=".16" stroke="#f87171"/>
    <text class="m" x="38" y="49" font-size="20" font-weight="700" fill="#fca5a5" text-anchor="middle">A</text>
    <text class="t" x="74" y="38" font-size="17" font-weight="700" fill="#e6edf6">Security alerts</text>
    <text class="t" x="74" y="60" font-size="13" fill="#9fb3c8">DNS tunneling · FTP</text>
  </g></g>
  <g class="up" style="--d:0.64s"><g transform="translate(40,268)">
    <rect width="290" height="84" rx="14" fill="#13213f" stroke="#a78bfa" stroke-opacity=".35"/>
    <rect class="sel" style="animation-delay:6s" width="290" height="84" rx="14" fill="#a78bfa" fill-opacity=".1" stroke="#c4b5fd" stroke-width="2.4" opacity="0"/>
    <rect class="key" style="animation-delay:6s" x="18" y="22" width="40" height="40" rx="9" fill="#a78bfa" fill-opacity=".16" stroke="#a78bfa"/>
    <text class="m" x="38" y="49" font-size="20" font-weight="700" fill="#c4b5fd" text-anchor="middle">L</text>
    <text class="t" x="74" y="38" font-size="17" font-weight="700" fill="#e6edf6">Raw logs</text>
    <text class="t" x="74" y="60" font-size="13" fill="#9fb3c8">press V for a live viewer</text>
  </g></g>
  <g class="up" style="--d:0.73s"><g transform="translate(355,268)">
    <rect width="290" height="84" rx="14" fill="#13213f" stroke="#34d399" stroke-opacity=".35"/>
    <rect class="sel" style="animation-delay:7s" width="290" height="84" rx="14" fill="#34d399" fill-opacity=".1" stroke="#6ee7b7" stroke-width="2.4" opacity="0"/>
    <rect class="key" style="animation-delay:7s" x="18" y="22" width="40" height="40" rx="9" fill="#34d399" fill-opacity=".16" stroke="#34d399"/>
    <text class="m" x="38" y="49" font-size="20" font-weight="700" fill="#6ee7b7" text-anchor="middle">O</text>
    <text class="t" x="74" y="38" font-size="17" font-weight="700" fill="#e6edf6">Overview</text>
    <text class="t" x="74" y="60" font-size="13" fill="#9fb3c8">all panels at once</text>
  </g></g>
  <g class="up" style="--d:0.82s"><g transform="translate(670,268)">
    <rect width="290" height="84" rx="14" fill="#13213f" stroke="#22d3ee" stroke-opacity=".35"/>
    <rect class="sel" style="animation-delay:8s" width="290" height="84" rx="14" fill="#22d3ee" fill-opacity=".1" stroke="#67e8f9" stroke-width="2.4" opacity="0"/>
    <rect class="key" style="animation-delay:8s" x="18" y="22" width="40" height="40" rx="9" fill="#22d3ee" fill-opacity=".16" stroke="#22d3ee"/>
    <text class="m" x="38" y="49" font-size="20" font-weight="700" fill="#67e8f9" text-anchor="middle">S</text>
    <text class="t" x="74" y="38" font-size="17" font-weight="700" fill="#e6edf6">Split screen</text>
    <text class="t" x="74" y="60" font-size="13" fill="#9fb3c8">pick up to 4 panels</text>
  </g></g>
  <text class="m" x="40" y="396" font-size="12" fill="#7f95ad">press <tspan fill="#67e8f9">?</tspan> for help · <tspan fill="#67e8f9">Space</tspan> pause · <tspan fill="#67e8f9">C</tspan> clear · <tspan fill="#67e8f9">Q</tspan> quit<tspan class="cur" fill="#22d3ee"> █</tspan></text>
  <g clip-path="url(#card)"><polygon class="sw" points="0,0 140,0 90,420 -50,420" fill="url(#shine)"/></g>
</svg>